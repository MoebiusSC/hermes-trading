assets:                      # each gets its own strategy, paper account and reflection cycle
  - "BTC/USDT"               # crypto: BASE/QUOTE, simulated fills, $10,000 virtual account each
  - "SOL/USDT"
  - "ETH/USDT"
  - "DOGE/USDT"
  - "XRP/USDT"
  - "BNB/USDT"
  - "LINK/USDT"
  - "AVAX/USDT"
  - "ADA/USDT"
  - "SUI/USDT"
  - "LTC/USDT"
  - "PAXG/USDT"
  - "SPY"                    # stocks/ETFs: bare ticker, real fills in the Alpaca paper account
  - "QQQ"
  - "GLD"
  - "TLT"
  - "USO"
  - "SECZ"
  - "VOO"
  - "BTC/USDT@momentum"
  - "SOL/USDT@momentum"
  - "ETH/USDT@momentum"
  - "DOGE/USDT@momentum"
  - "XRP/USDT@momentum"
  - "BNB/USDT@momentum"
  - "LINK/USDT@momentum"
  - "AVAX/USDT@momentum"
  - "ADA/USDT@momentum"
  - "SUI/USDT@momentum"
  - "LTC/USDT@momentum"
  - "PAXG/USDT@momentum"
stock_equity_per_asset: 200  # virtual account per stock; together within the $1,000 Alpaca balance
stock_equity_overrides:      # accounts opened under the earlier $500 default
  SPY: 500
  QQQ: 500
target_return_30d: 0.05      # success
max_drawdown:      0.08      # failure
min_sharpe:        1.2       # quality bar
failure_below:     -0.04     # score floor — steeply negative below this
reflection_every:  10        # cycle cadence (per asset): closed trades between reflections
one_variable_only: true      # scientific-method guardrail
costs:                       # % per side on simulated fills (stocks fill at Alpaca: real prices, no commission)
  crypto:                    # OKX, regular (VIP 0) taker fees
    venue: okx
    long: {fee_pct: 0.1, slippage_pct: 0.02}                  # spot
    short: {fee_pct: 0.05, slippage_pct: 0.02, funding: true}  # USDT perpetual: pays/receives funding
  min_stop_x_costs: 3        # a stop is never closer than 3x the round-trip cost
risk:                        # portfolio limits checked before every automatic entry
  max_open_positions: 31     # always-in-market strategies: one position per pair and sleeve, plus ETFs
  max_open_crypto: 24        # 12 pairs x (trend + momentum sleeve)
  max_exposure_pct: 60       # invested value / total capital (24 accounts at 30% ~ 30%)
strategy_defaults:           # applied once at boot to strategies that predate them (recorded as "migration")
  exit_rsi: 75               # the first key marks a strategy as migrated
  entry.timeframe: "15m"
  entry.threshold: 25
  trend_filter: "off"
  stop_atr_mult: 3.0
  take_profit_r: 3.0
  max_hold_min: 0
strategy_defaults_note: >-
  Backtest de 60 días en los 12 pares cripto con comisiones reales (0,1% + 0,02% por lado). La estrategia
  anterior (RSI de 1 min, salida en 70, stop 2%) perdió -9,6% de media por par en los primeros 42 días y
  -4,6% en los 18 siguientes. Esta configuración fue la mejor de 288 combinaciones en los primeros 42 días
  (+0,6%) y quedó en -0,05% en los 18 días que no se usaron para elegirla: casi sin pérdidas, pero sin
  ventaja demostrada. En los ETFs pasó de +0,3% a +8,1% en total (pocas operaciones).
strategy_migrations:         # named one-off changes, applied once per asset at boot (recorded as "migration")
  - id: trend-4h-v1
    kinds: [crypto]
    changes:
      entry.indicator: ema_cross
      entry.direction: both
      entry.timeframe: "4h"
      entry.fast: 50
      entry.slow: 200
      trend_filter: "off"
      stop_atr_mult: 3.0
      take_profit_r: 0
      max_hold_min: 0
      position_pct: 30
    note: >-
      Cambio de reversión con RSI a seguimiento de tendencia: long mientras la EMA 50 está sobre la EMA 200
      en velas de 4 h, short mientras está debajo, stop de 3 ATR y sin objetivo, con el 30% de la cuenta por
      posición. Backtest de 3 años en los 12 pares con comisiones: con el 100% por posición ganó +40%, +52% y
      +48% (sep 2023-24, 2024-25, 2025-26) mientras comprar y mantener hizo +148%, +99% y -39%; la
      configuración se eligió con el último año y los dos anteriores sirvieron de verificación. Al 30%, la
      cartera: +13,7%, +21,7% y +14,3%, drawdown máximo 12,5%. La estrategia RSI anterior perdió -19% en el
      último año. Los ETFs no cambian: ahí seguir la tendencia rinde bastante menos que mantener.
  - id: trend-4h-v2
    kinds: [crypto]
    changes:
      stop_atr_mult: 5.0
    note: >-
      Stop de 5 ATR en lugar de 3. Backtest de 5 años (sep 2021 - sep 2026) con los 12 pares y costos:
      junto con la sub-cuenta de momentum, la combinación EMA 50/200 con stop de 5 ATR tuvo el mejor
      Sharpe de 5 años (0,98) de 650 combinaciones, dentro de una meseta de configuraciones parecidas
      (0,93-0,98), no un pico aislado.
  - id: paxg-long-only-v1
    kinds: [crypto]
    assets: ["PAXG/USDT"]
    changes:
      entry.direction: long
    note: >-
      PAXG solo en largo: los shorts se simulan ahora como perpetuos de OKX (comisión 0,05% y funding) y
      OKX no lista un perpetuo de PAXG, así que un short no sería ejecutable. El short abierto se cierra
      en el primer ciclo tras el despliegue (signal_exit).
sleeves:                     # extra strategies per pair, each with its own simulated account (asset@sleeve)
  momentum:
    kinds: [crypto]
    strategy:
      entry.indicator: tsmom
      entry.direction: long
      entry.timeframe: "1d"
      entry.lookback: 120
      entry.target_vol: 0.5
      trend_filter: "off"
      stop_atr_mult: 3.0
      take_profit_r: 0
      max_hold_min: 0
      position_pct: 30
    note: >-
      Sub-cuenta de momentum: long mientras el cierre diario supera al de hace 120 días (fuera cuando
      no), con el tamaño reducido si la volatilidad pasa del 50% anual, 30% de la cuenta por posición.
      Opera junto a la estrategia de tendencia del par, cada una con su cuenta. Backtest de 5 años con
      costos, 50/50 con la tendencia (100% de exposición): -5,3%, -0,6%, +68%, +58%, +25% por año (sep
      2021-26), Sharpe 0,98, frente a -15,8%, -5,2%, +61%, +56%, +48,5% y Sharpe 0,81 de la tendencia
      sola; comprar y mantener: -50%, -9%, +141%, +100%, -37%. Refinando la combinación año a año con
      solo los datos anteriores (walk-forward), los años 3-5 dieron Sharpe 1,19 frente a 0,85 de la
      tendencia sola.
