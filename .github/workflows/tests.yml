name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install pyflakes
      # undefined names (a missing import) fail here instead of in production
      - run: python -m pyflakes hermes_trading tests
      - run: python -m unittest discover -s tests -p "test_*.py" -v
